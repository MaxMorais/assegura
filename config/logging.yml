version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "module": "%(module)s", "function": "%(funcName)s", "line": %(lineno)d, "message": "%(message)s"}'
    datefmt: '%Y-%m-%dT%H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
  
  json_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/app.json
    maxBytes: 10485760  # 10MB
    backupCount: 3

loggers:
  # Application loggers
  src:
    level: DEBUG
    handlers: [console, file, json_file]
    propagate: false
  
  # API specific logging
  src.api:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  # Domain layer logging
  src.domain:
    level: DEBUG
    handlers: [file, json_file]
    propagate: false
  
  # Infrastructure logging  
  src.infrastructure:
    level: INFO
    handlers: [file, error_file]
    propagate: false
  
  # Database logging
  sqlalchemy:
    level: WARNING
    handlers: [file]
    propagate: false
  
  # HTTP client logging
  httpx:
    level: INFO
    handlers: [file]
    propagate: false
  
  # Authentication logging
  src.infrastructure.auth:
    level: INFO
    handlers: [console, file, error_file]
    propagate: false
  
  # Test execution logging
  src.domain.execution:
    level: DEBUG
    handlers: [console, file, json_file]
    propagate: false
  
  # ERPNext integration logging
  src.infrastructure.erpnext:
    level: INFO
    handlers: [file, error_file]
    propagate: false

root:
  level: INFO
  handlers: [console, file, error_file]

# Environment-specific configurations
dev:
  level: DEBUG
  handlers: [console, file]
  disable_existing_loggers: false

prod:
  level: INFO
  handlers: [json_file, error_file]
  disable_existing_loggers: false
  
test:
  level: WARNING
  handlers: [console]
  disable_existing_loggers: true