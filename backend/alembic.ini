"""Alembic configuration file.

Database migration configuration with multi-tenant support and
constitutional compliance for ERPNext Test Automation Meta-Framework.
"""

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration file names
# Constitutional compliance: Use timestamp and descriptive names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Migration versioning
version_locations = %(here)s/versions

# Output encoding
output_encoding = utf-8

# Database URL (will be overridden by env.py)
sqlalchemy.url = postgresql://localhost/assegura_test_framework

# Multi-tenant configuration
# Enables schema-aware migrations for tenant isolation
compare_type = true
compare_server_default = true
include_schemas = true

# Constitutional compliance settings
user_module_prefix = assegura_
transaction_per_migration = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S